version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pixora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pixora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Application (Development with hot-reload)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixora-app
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pixora-network
    volumes:
      # Mount source code for hot-reload
      - .:/pixora-app
      - /pixora-app/node_modules
      - ./temp:/pixora-app/temp

networks:
  pixora-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
